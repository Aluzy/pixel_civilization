<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Pixel Civilisation : une simulation à observer où un pixel noir bâtit une civilisation."
    />
    <title>Pixel Civilisation</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;

        height: 100vh;

        image-rendering: pixelated;

  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
